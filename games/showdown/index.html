const $=x=>document.getElementById(x),sizes=[3,4,5,5,4,3],bets=[10,20,40,60,100,200,500,1000],keys=['J','Q','K','A','hat','bottle','gun','bandit'];
const art={J:[16,365,65,75],Q:[15,447,67,78],K:[181,286,67,65],A:[181,365,68,70],hat:[173,442,86,83],bottle:[91,316,73,87],gun:[260,286,77,78],bandit:[338,399,80,88]};
let saved;try{saved=JSON.parse(localStorage.getItem('onli88_showdown_demo_v1')||'null')}catch{}let balance=Number.isSafeInteger(saved?.balance)&&saved.balance>=0?saved.balance:100000,betIndex=2,history=Array.isArray(saved?.history)?saved.history.slice(0,40):[],board=[],busy=false,auto=0,free=0,multiplier=1,fast=false,muted=false,audio,roundTotal=0,autoChoice=10,pending=null,spinId=0;const money=n=>(n/100).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){try{localStorage.setItem('onli88_showdown_demo_v1',JSON.stringify({balance,history}))}catch{}}function ui(){$('balance').textContent=money(balance);$('bet').textContent=money(bets[betIndex]);$('win').textContent=money(roundTotal);$('multiplier').textContent='x'+multiplier;$('free').textContent=free?'VÒNG QUAY MIỄN PHÍ: '+free:'';$('remaining').textContent=auto?'Quay tự động còn '+auto+' lượt · bấm ■ để dừng':'';$('auto').textContent=auto?'■':'▷';$('spin').setAttribute('aria-disabled',String(busy))}
function syncMusic(){const m=$('music');m.volume=.55;$('soundToggle').textContent=muted?'♫ Tắt':'♫ Bật';if(muted||document.hidden)m.pause();else m.play().catch(()=>{$('soundToggle').textContent='♫ Chạm bật'})}
$('soundToggle').onclick=()=>{if(!muted&&$('music').paused){syncMusic();return}muted=!muted;syncMusic()};
function tone(freq=440,duration=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
const pause=ms=>new Promise(r=>setTimeout(r,fast?ms*.32:ms));function randomKey(){let r=Math.random();return r<.023?'scatter':keys[Math.floor(Math.random()*keys.length)]}function cell(col){return{k:randomKey(),gold:(col===2||col===3)&&Math.random()<.12}}
function symbolHTML(v,c,r){let inside;if(v.k==='W')inside='<div class="wild">★<br>WILD</div>';else if(v.k==='scatter')inside='<div class="scatter"><b>▰</b>SCATTER</div>';else inside='<svg viewBox="'+art[v.k].join(' ')+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><use href="#sheet"/></svg>';return '<div class="symbol '+(v.gold?'gold':'')+'" data-c="'+c+'" data-r="'+r+'" aria-label="'+v.k+'">'+inside+'</div>'}
function draw(){ $('reels').innerHTML=board.map((col,c)=>'<div class="reel">'+col.map((v,r)=>symbolHTML(v,c,r)).join('')+'</div>').join('')}
async function rollReels(){const els=[...$('reels').children];els.forEach((el,c)=>{const h=el.clientWidth;el.style.height=h*sizes[c]+'px';el.style.setProperty('--cell',h+'px');const strip=Array.from({length:sizes[c]+2},()=>cell(c));el.innerHTML='<div class="strip">'+strip.map((v,r)=>symbolHTML(v,c,r)).join('')+'</div>';el.classList.add('rolling')});await pause(550);for(let c=0;c<6;c++){let el=els[c];el.classList.remove('rolling');el.innerHTML=board[c].map((v,r)=>symbolHTML(v,c,r)).join('');el.classList.add('landed');tone(150+c*25,.04);await pause(105)} }
function settle(){let found=new Set(),value=0;for(let k of keys){let counts=board.map(col=>col.filter(v=>v.k===k||v.k==='W').length);let n=0,ways=1;for(let c of counts){if(!c)break;n++;ways*=c}if(n>=3){let rate=({J:2,Q:2,K:3,A:3,hat:5,bottle:6,gun:8,bandit:10})[k];value+=Math.max(1,Math.round(bets[betIndex]*rate*ways*(n-2)/100));for(let c=0;c<n;c++)board[c].forEach((v,r)=>{if(v.k===k||v.k==='W')found.add(c+':'+r)})}}return{found,value:Math.min(value*multiplier,bets[betIndex]*5000-roundTotal)}}
function particles(found){const game=document.querySelector('.game'),rect=game.getBoundingClientRect();found.forEach(pos=>{let[c,r]=pos.split(':');const cell=document.querySelector('[data-c="'+c+'"][data-r="'+r+'"]'),box=cell.getBoundingClientRect();for(let i=0;i<9;i++){const p=document.createElement('span');p.className='coin';p.style.left=(box.left-rect.left+box.width/2)+'px';p.style.top=(box.top-rect.top+box.height/2)+'px';p.style.setProperty('--x',((Math.random()-.5)*95)+'px');p.style.setProperty('--y',(-35+Math.random()*135)+'px');p.style.animationDelay=Math.random()*.12+'s';game.append(p);setTimeout(()=>p.remove(),1100)}})}
async function spin(){if(busy||$('modal').classList.contains('open'))return;if(document.hidden){auto=0;ui();return}let isFree=free>0,cost=isFree?0:bets[betIndex];if(balance<cost){auto=0;ui();openPanel('funds');return}busy=true;balance-=cost;if(isFree)free--;if(auto)auto--;multiplier=1;roundTotal=0;spinId++;$('message').textContent='Chúc bạn may mắn!';$('spin').classList.add('busy');board=sizes.map((n,c)=>Array.from({length:n},()=>cell(c)));draw();ui();tone(220,.1);await rollReels();let scatters=board.flat().filter(v=>v.k==='scatter').length;if(scatters>=3){free+=10;toast('+10 vòng quay miễn phí');tone(880,.3)}
for(let cascade=0;cascade<10;cascade++){let result=settle();if(!result.found.size||result.value<=0)break;roundTotal+=result.value;result.found.forEach(pos=>{let[c,r]=pos.split(':');document.querySelector('[data-c="'+c+'"][data-r="'+r+'"]').classList.add('win')});$('message').textContent='THẮNG '+money(result.value)+' · x'+multiplier;ui();tone(440+Math.min(multiplier,16)*30,.2);particles(result.found);await pause(750);result.found.forEach(pos=>{let[c,r]=pos.split(':');document.querySelector('[data-c="'+c+'"][data-r="'+r+'"]').classList.add('removing')});await pause(300);board=board.map((col,c)=>{let keep=col.map((v,r)=>result.found.has(c+':'+r)?(v.gold?{k:'W',gold:false,old:r}:null):{...v,old:r}).filter(Boolean);const added=sizes[c]-keep.length;return [...Array.from({length:added},(_,i)=>({...cell(c),old:i-added})),...keep]});multiplier=Math.min(1024,multiplier*2);draw();document.querySelectorAll('.symbol').forEach(el=>{let c=+el.dataset.c,r=+el.dataset.r,d=r-(board[c][r].old??r);if(d&&el.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)el.animate([{transform:'translateY('+(-d*el.clientWidth)+'px)'},{transform:'translateY(0)'}],{duration:fast?150:420,easing:'cubic-bezier(.3,0,.8,1)'})});ui();await pause(400)}
balance+=roundTotal;history.unshift({time:Date.now(),bet:cost,win:roundTotal,free:isFree});history=history.slice(0,40);save();$('message').textContent=roundTotal?'TỔNG THẮNG '+money(roundTotal):'Thắng tới 3.600 đường!';busy=false;$('spin').classList.remove('busy');ui();if((auto||free)&&!document.hidden)setTimeout(()=>{if((auto||free)&&!busy&&!$('modal').classList.contains('open'))spin()},fast?250:900)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
function closePanel(){if(pending){pending=null} $('modal').classList.remove('open');$('menu').focus()}
function openPanel(tab){if(busy){toast('Chờ vòng quay hiện tại kết thúc');return}auto=0;ui();$('modal').classList.add('open');$('nav').style.display=['auto','buy','funds'].includes(tab)?'none':'flex';let title='',html='';
if(tab==='auto'){title='Quay Tự Động';html='<p>Số Vòng Quay Tự Động</p><div class="choices">'+[10,30,50,80,1000].map(n=>'<button data-count="'+n+'" class="'+(n===autoChoice?'selected':'')+'">'+n+'</button>').join('')+'</div><button class="primary" data-action="autostart">Bắt đầu</button><p>Chỉ sử dụng điểm thử. Tự dừng khi rời tab hoặc không đủ điểm.</p>'}
else if(tab==='buy'){title='Mua vòng quay miễn phí';html='<p>Nhận 10 vòng quay miễn phí với giá <b>'+money(bets[betIndex]*100)+' điểm thử</b>.</p><p class="notice-rule">Tính năng và mức giá của bản mô phỏng, chưa được xác minh từ game gốc.</p><button class="primary" data-action="buyconfirm">Xác nhận bằng điểm thử</button>'}
else if(tab==='funds'){title='Điểm chơi thử';html='<p>Bạn không đủ điểm thử cho lượt này. Có thể đặt lại số dư thành 1.000 điểm.</p><button class="primary" data-action="reset">Nhận lại điểm thử</button>'}
else if(tab==='rules'){title='Luật Chơi';html='<p class="notice-rule">Bản tái dựng từ video. Hình thức được tham khảo từ video; xác suất, giá trị trả thưởng và điều kiện thưởng bên dưới là quy tắc mô phỏng tự xây dựng, không phải thuật toán gốc.</p><h3>Ván chơi chính</h3><ul><li>6 cột với 3–4–5–5–4–3 biểu tượng, tương ứng 3.600 đường kết hợp.</li><li>Biểu tượng giống nhau xuất hiện từ cột trái, liên tục ít nhất 3 cột sẽ tạo thắng.</li><li>Biểu tượng thắng biến mất, biểu tượng phía trên rơi xuống và được bổ sung.</li></ul><h3>Khung Vàng và Wild</h3><p>Khung vàng có ở cột 3 và 4. Biểu tượng khung vàng nằm trong lượt thắng chuyển thành Wild sau khi rơi. Wild thay thế các biểu tượng thông thường, trừ Scatter.</p><h3>Số nhân</h3><p>Bắt đầu ở x1. Sau mỗi đợt thắng liên tiếp, số nhân tăng gấp đôi, tối đa x1024. Mỗi lượt mới bắt đầu lại từ x1; tối đa 10 đợt rơi trong bản thử.</p><h3>Vòng quay miễn phí</h3><p>Từ 3 Scatter nhận 10 lượt miễn phí. Mức cược giữ nguyên. Có thể mua 10 lượt bằng 100 lần mức cược.</p><h3>Điểm thử</h3><p>Điểm lưu riêng trên trình duyệt này, không có giá trị tiền tệ và không đồng bộ tài khoản. Một vòng giới hạn tổng thưởng ở 5.000 lần mức cược.</p>'}
else if(tab==='pay'){title='Bảng Trả Thưởng';html='<p>Hệ số cơ sở của bản mô phỏng trên 100 phần mức cược. Thưởng = cược × hệ số × số đường kết hợp × (số cột liên tiếp − 2) ÷ 100 × số nhân hiện tại.</p><table><tr><th>Biểu tượng</th><th>Hệ số</th></tr>'+[['J / Q',2],['K / A',3],['Mũ cao bồi',5],['Chai rượu',6],['Súng',8],['Cao bồi',10]].map(a=>'<tr><td>'+a[0]+'</td><td>'+a[1]+'</td></tr>').join('')+'</table><p>Đây là bảng thử nghiệm, không được trích từ máy chủ game gốc.</p>'}
else if(tab==='history'){title='Lịch Sử Trò Chơi';html=history.length?'<p>40 lượt gần nhất trên thiết bị này</p>'+history.map(h=>'<div class="history-row"><span>'+new Date(h.time).toLocaleTimeString('vi-VN')+(h.free?' · Miễn phí':'')+'</span><span>Cược '+money(h.bet)+'</span><b>+'+money(h.win)+'</b></div>').join(''):'<p>Chưa có lượt quay. Bắt đầu chơi để xem lịch sử.</p>'}
else if(tab==='sound'){title='Âm Thanh';html='<p>Nhạc nền trích từ video tham chiếu, kết hợp âm báo của bản chơi thử.</p><button class="primary" data-action="sound">'+(muted?'Bật âm thanh':'Tắt âm thanh')+'</button>'}
else if(tab==='exit'){title='Thoát Trò Chơi';html='<p>Bạn muốn trở về trang ONLI88?</p><a class="primary" style="text-align:center;text-decoration:none" href="../../">Thoát</a>'}
else{title='Wild Bounty Showdown';html='<p style="text-align:center">Ví điểm thử<br><b style="font-size:28px;color:#ffdf40">'+money(balance)+'</b></p><p style="text-align:center">Bản tái dựng trên ONLI88</p>'}
$('panelTitle').textContent=title;$('content').innerHTML=html;$('close').focus()}
$('spin').onclick=()=>{if(auto){auto=0;ui();return}spin()};$('auto').onclick=()=>{if(auto){auto=0;ui()}else openPanel('auto')};$('turbo').onclick=()=>{fast=!fast;$('turbo').classList.toggle('active',fast);toast(fast?'Đã bật quay nhanh':'Đã tắt quay nhanh')};$('minus').onclick=()=>changeBet(-1);$('plus').onclick=()=>changeBet(1);function changeBet(n){if(busy||free||auto){toast('Không thể đổi mức cược trong lượt đang chơi');return}betIndex=Math.max(0,Math.min(bets.length-1,betIndex+n));ui();tone(330,.05)}$('buy').onclick=()=>openPanel('buy');$('menu').onclick=()=>openPanel('menu');$('close').onclick=closePanel;$('modal').onclick=e=>{if(e.target===$('modal'))closePanel()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});document.addEventListener('visibilitychange',()=>{if(document.hidden){auto=0;ui()}if(!$('intro'))syncMusic()});document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab)openPanel(tab.dataset.tab);let count=e.target.closest('[data-count]');if(count){autoChoice=+count.dataset.count;document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('selected',+b.dataset.count===autoChoice))}let action=e.target.closest('[data-action]')?.dataset.action;if(action==='autostart'){auto=autoChoice;closePanel();spin()}if(action==='buyconfirm'){let cost=bets[betIndex]*100;if(balance<cost){openPanel('funds');return}balance-=cost;free+=10;save();closePanel();ui();spin()}if(action==='reset'){balance=100000;save();closePanel();ui()}if(action==='sound'){muted=!muted;syncMusic();openPanel('sound')}});$('start').onclick=()=>{$('intro').remove();syncMusic();tone(440,.15)};board=sizes.map((n,c)=>Array.from({length:n},()=>cell(c)));draw();ui();
</script></body></html>
