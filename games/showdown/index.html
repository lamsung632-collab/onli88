const pause=ms=>new Promise(r=>setTimeout(r,fast?ms*.32:ms));function randomKey(){let r=Math.random();return r<.023?'scatter':keys[Math.floor(Math.random()*keys.length)]}function cell(col){return{k:randomKey(),gold:(col===2||col===3)&&Math.random()<.12}}

function settle(){let found=new Set(),value=0;for(let k of keys){let counts=board.map(col=>col.filter(v=>v.k===k||v.k==='W').length);let n=0,ways=1;for(let c of counts){if(!c)break;n++;ways*=c}if(n>=3){let rate=({J:2,Q:2,K:3,A:3,hat:5,bottle:6,gun:8,bandit:10})[k];value+=Math.max(1,Math.round(bets[betIndex]*rate*ways*(n-2)/100));for(let c=0;c<n;c++)board[c].forEach((v,r)=>{if(v.k===k||v.k==='W')found.add(c+':'+r)})}}return{found,value:Math.min(value*multiplier,bets[betIndex]*5000-roundTotal)}}

async function spin(){if(busy||$('modal').classList.contains('open'))return;if(document.hidden){auto=0;ui();return}let isFree=free>0,cost=isFree?0:bets[betIndex];if(balance<cost){auto=0;ui();openPanel('funds');return}busy=true;balance-=cost;if(isFree)free--;if(auto)auto--;multiplier=1;roundTotal=0;spinId++;$('message').textContent='Chúc bạn may mắn!';$('spin').classList.add('busy');board=sizes.map((n,c)=>Array.from({length:n},()=>cell(c)));draw();$('reels').classList.add('spinning');ui();tone(220,.1);await pause(850);$('reels').classList.remove('spinning');draw();let scatters=board.flat().filter(v=>v.k==='scatter').length;if(scatters>=3){free+=10;toast('+10 vòng quay miễn phí');tone(880,.3)}
for(let cascade=0;cascade<10;cascade++){let result=settle();if(!result.found.size||result.value<=0)break;roundTotal+=result.value;result.found.forEach(pos=>{let[c,r]=pos.split(':');document.querySelector('[data-c="'+c+'"][data-r="'+r+'"]').classList.add('win')});$('message').textContent='THẮNG '+money(result.value)+' · x'+multiplier;ui();tone(440+Math.min(multiplier,16)*30,.2);particles();await pause(750);result.found.forEach(pos=>{let[c,r]=pos.split(':');document.querySelector('[data-c="'+c+'"][data-r="'+r+'"]').classList.add('removing')});await pause(300);board=board.map((col,c)=>{let keep=col.map((v,r)=>result.found.has(c+':'+r)?(v.gold?{k:'W',gold:false}:null):v).filter(Boolean);return [...Array.from({length:sizes[c]-keep.length},()=>cell(c)),...keep]});multiplier=Math.min(1024,multiplier*2);draw();document.querySelectorAll('.symbol').forEach(el=>el.classList.add('drop'));ui();await pause(400)}

function openPanel(tab){if(busy){toast('Chờ vòng quay hiện tại kết thúc');return}auto=0;ui();$('modal').classList.add('open');$('nav').style.display=['auto','buy','funds'].includes(tab)?'none':'flex';let title='',html='';
